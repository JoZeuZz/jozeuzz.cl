# Proyecto Docker Compose exclusivo de POC-1a. Imágenes fijadas por digest.
# Sin socket Docker, sin puertos externos: sólo 127.0.0.1. La base de datos no publica puertos.
name: jozeuzz-poc-a

x-node: &node
  image: node:24.22.0-trixie-slim@sha256:7f486cabe892bff8fef04c0f7da8dba84a560be3e4e2740b7a86afc57ebec315
  user: "1000:1000"
  working_dir: /app
  volumes:
    - ./:/app
  environment:
    NEXT_TELEMETRY_DISABLED: "1"
    NPM_CONFIG_CACHE: /app/.npm-cache

services:
  db:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: poc
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: ${POC_DB_PASSWORD:?ejecuta ./poc.sh init}
    # Logs sin PII (diseño §5.5): sin ERROR, sin sentencias, sin DETAIL.
    command: ["postgres", "-c", "log_min_messages=fatal", "-c", "log_min_error_statement=panic", "-c", "log_error_verbosity=terse"]
    volumes:
      - db:/var/lib/postgresql
    networks: [db_app, db_prod]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d poc"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Instalador puntual: única pieza de desarrollo con salida a Internet.
  deps:
    <<: *node
    profiles: [deps]
    networks: [externa]
    command: ["npm", "ci"]

  app:
    <<: *node
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://poc:${POC_DB_PASSWORD:?ejecuta ./poc.sh init}@db:5432/${POC_DATABASE_NAME:-poc}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?ejecuta ./poc.sh init}
      POC_SERVER_URL: https://127.0.0.1:3443
      INTAKE_ORIGEN_PUBLICO: https://127.0.0.1:3443
      INTAKE_SECRETO: ${INTAKE_SECRETO:?ejecuta ./poc.sh init}
      INTAKE_TIEMPO_MINIMO_MS: "200"
      NODE_EXTRA_CA_CERTS: /app/.tls/ca.crt
      POC_FALLOS_INYECTABLES: ${POC_FALLOS_INYECTABLES:-0}
    command: ["npm", "run", "dev"]
    networks: [db_app, proxy_app]
    depends_on:
      db:
        condition: service_healthy

  # Producción local (perfil prod): misma imagen Node, build + next start, schema y medios propios.
  app-prod:
    <<: *node
    profiles: [prod]
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://poc:${POC_DB_PASSWORD:?ejecuta ./poc.sh init}@db:5432/${POC_DATABASE_NAME:-poc}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?ejecuta ./poc.sh init}
      POC_SERVER_URL: https://127.0.0.1:3444
      INTAKE_ORIGEN_PUBLICO: https://127.0.0.1:3444
      INTAKE_SECRETO: ${INTAKE_SECRETO:?ejecuta ./poc.sh init}
      INTAKE_TIEMPO_MINIMO_MS: "200"
      NODE_EXTRA_CA_CERTS: /app/.tls/ca.crt
      POC_DB_SCHEMA: poc_prod
      POC_MEDIA_DIR: /app/media-store-prod
      POC_DIST_DIR: .next-prod
      POC_NO_PUSH: "1"
    command: ["npm", "run", "start"]
    networks: [db_prod, proxy_prod]
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:1.30.6-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    ports:
      - "127.0.0.1:3443:3443"
      - "127.0.0.1:3444:3444"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/ip-cliente.produccion.conf:/etc/nginx/poc/ip-cliente.conf:ro
      - ./.tls:/etc/nginx/tls:ro
    networks: [entrada, proxy_app, proxy_prod, e2e]

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
    profiles: [e2e]
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./:/app
    networks: [e2e]
    environment:
      HOME: /tmp
      POC_BASE_URL: https://127.0.0.1:3443
      NODE_EXTRA_CA_CERTS: /app/.tls/ca.crt
      E2E_RESET: ${E2E_RESET:-}

volumes:
  db:

networks:
  entrada: {}
  externa: {}
  db_app:
    internal: true
  db_prod:
    internal: true
  proxy_app:
    internal: true
  proxy_prod:
    internal: true
  e2e:
    internal: true
