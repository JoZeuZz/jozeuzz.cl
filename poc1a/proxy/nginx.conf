worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr alert;

events { worker_connections 256; }

http {
  access_log off;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 1m;
  client_body_buffer_size 1m;
  ssl_certificate /etc/nginx/tls/cadena.crt;
  ssl_certificate_key /etc/nginx/tls/servidor.key;
  ssl_protocols TLSv1.3;
  map $http_upgrade $conexion { default upgrade; '' ''; }
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $conexion;
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header X-Forwarded-Proto https;
  include /etc/nginx/poc/ip-cliente.conf;

  server {
    listen 3443 ssl;
    set $destino http://app:3000;
    location / { proxy_pass $destino; }
  }

  server {
    listen 3444 ssl;
    set $destino http://app-prod:3000;
    location / { proxy_pass $destino; }
  }
}
