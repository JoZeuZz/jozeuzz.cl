map $http_x_poc_ip_sintetica $poc_ip_cliente {
  default $remote_addr;
  "~^203\.0\.113\.([1-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-4])$" $http_x_poc_ip_sintetica;
  "~^2001:db8:[0-9a-f]{1,4}:[0-9a-f]{1,4}::1$" $http_x_poc_ip_sintetica;
}
proxy_set_header X-Real-IP $poc_ip_cliente;
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Poc-Ip-Sintetica "";
proxy_set_header X-Poc-Fallo $http_x_poc_fallo;
