# CI de jozeuzz.cl: mismas puertas que en local, con las imágenes fijadas por digest
# (tooling/node-image.txt y el PostgreSQL de scripts/integration-harness).
# Se ejecuta como root dentro de los contenedores, igual que el entorno local, para que
# npm tenga HOME y caché escribibles.
name: ci

on:
  push:
    branches: [main, 'integ/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  producto:
    name: producto (lint, tipos, unit, contrato, integración)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: npm ci (Node 24 fijado)
        run: sudo scripts/run-node npm ci
      - name: lint
        run: sudo scripts/run-node npm run lint
      - name: typecheck
        run: sudo scripts/run-node npm run typecheck
      - name: test:foundation
        run: sudo scripts/run-node npm run test:foundation
      - name: test:unit
        run: sudo scripts/run-node npm run test:unit
      - name: contrato (oráculo y mutantes)
        run: sudo scripts/run-node node --test contrato/test/*.test.mjs
      - name: integración (PostgreSQL 18.6, migraciones)
        run: sudo scripts/integration-harness

  plano-control:
    name: plano de control JZ-AI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # El plano de control corre en el host, como en local: necesita git en /usr/bin, que la
      # imagen de Node del producto no trae. Misma versión de Node que tooling/node-image.txt.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0
      # sandbox.test.mjs, verify.test.mjs, opencode-native.mjs e integration.mjs necesitan
      # el host (namespaces, motores reales): se ejecutan fuera de CI.
      - name: jz-autonomy y jz-gitops
        run: node --test tools/jz-autonomy/test/*.test.js tools/jz-gitops/test/*.test.mjs
      - name: .jz (política, árbol, recuperación, hook, OpenCode)
        run: >-
          node --test
          .jz/tests/policy.test.mjs .jz/tests/tree.test.mjs .jz/tests/recovery.test.mjs
          .jz/tests/hook.test.mjs .jz/tests/opencode.test.mjs
